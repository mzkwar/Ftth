    return list.map(function (x) { return x.r; });
  }

  /* ---------- render ---------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildHead() {
    var thead = $("thead");
    thead.textContent = "";
    var tr = el("tr");
    COLS.forEach(function (c) {
      var th = el("th");
      th.scope = "col";
      if (c.type === "serial") {
        th.className = "pin noSort";
        th.textContent = c.label;
      } else {
        var b = el("button", "", c.label);
        b.type = "button";
        b.addEventListener("click", function () {
          if (state.sortKey === c.key) state.dir = -state.dir; else { state.sortKey = c.key; state.dir = 1; }
          syncControls(); render();
        });
        th.appendChild(b);
        th.setAttribute("aria-sort", state.sortKey === c.key ? (state.dir === 1 ? "ascending" : "descending") : "none");
      }
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  function render() {
    var list = currentView();
    buildHead();
    var tbody = $("tbody");
    tbody.textContent = "";
    if (!list.length) {
      var tr0 = el("tr"), td0 = el("td", "empty", "لا توجد صفوف مطابقة.");
      td0.colSpan = COLS.length;
      tr0.appendChild(td0); tbody.appendChild(tr0);
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (r, n) {
      var tr = el("tr");
      COLS.forEach(function (c) {
        var td = el("td", c.type === "serial" ? "pin" : "", c.type === "serial" ? String(n + 1) : cellText(c, r[c.key]));
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    $("srcName").textContent = state.name;
    var total = list.reduce(function (s, r) { return s + (num(r["المقدار"]) || 0); }, 0);
    var st = $("stats");
    st.textContent = "";
    [["عدد المعاملات", list.length + (list.length !== state.rows.length ? " من " + state.rows.length : "")],
     ["مجموع المقدار", fmtMoney(String(total)) + " دينار"]].forEach(function (p) {
      var s = el("span", "", p[0] + ": ");
      s.appendChild(el("b", "", p[1]));
      st.appendChild(s);
    });
  }

  function syncControls() {
    $("dir").textContent = state.dir === 1 ? "تصاعدي" : "تنازلي";
    $("sortKey").value = state.sortKey;
  }

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }

  /* ---------- export as image ---------- */
  function buildCanvas(list) {
    var FONT = '"IBM Plex Sans Arabic", Tahoma, sans-serif';
    var mctx = document.createElement("canvas").getContext("2d");
    var padX = 24, titleH = 70, headH = 46, rowH = 40, footH = 50, cellPad = 30;
    var texts = function (c, r, n) { return c.type === "serial" ? String(n + 1) : cellText(c, r[c.key]); };
    var widths = COLS.map(function (c) {
      mctx.font = "600 15px " + FONT;
      var w = mctx.measureText(c.label).width;
      mctx.font = "400 15px " + FONT;
      list.forEach(function (r, n) { w = Math.max(w, mctx.measureText(texts(c, r, n)).width); });
      return Math.ceil(w + cellPad);
    });
    var tableW = widths.reduce(function (a, b) { return a + b; }, 0);
    var W = Math.max(tableW + padX * 2, 720);
    var H = titleH + headH + rowH * list.length + footH + padX;
    var S = Math.min(2, 16000 / H);
    var cv = document.createElement("canvas");
    cv.width = Math.round(W * S); cv.height = Math.round(H * S);
    var g = cv.getContext("2d");
    g.scale(S, S);
    g.direction = "rtl"; g.textBaseline = "middle";
    var INK = "#14262b", MUTED = "#5b6e73", HEAD = "#0f4c5c", ZEB = "#f1f5f6", LINE = "#d5dddf";
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);

    g.textAlign = "right"; g.fillStyle = INK; g.font = "600 24px " + FONT;
    g.fillText("كشف المحفظة", W - padX, 28);
    g.fillStyle = MUTED; g.font = "400 14px " + FONT;
    var sortCol = COLS.filter(function (c) { return c.key === state.sortKey; })[0];
    g.fillText("عدد المعاملات: " + list.length + "   |   الترتيب: " + (sortCol ? sortCol.label : "") + (state.dir === 1 ? " تصاعدي" : " تنازلي"), W - padX, 54);

    var x0 = W - padX, y = titleH;
    function colX(i) { var x = x0; for (var k = 0; k < i; k++) x -= widths[k]; return x; }
    g.fillStyle = HEAD; g.fillRect(padX, y, W - padX * 2, headH);
    g.textAlign = "center"; g.fillStyle = "#ffffff"; g.font = "600 15px " + FONT;
    COLS.forEach(function (c, i) { g.fillText(c.label, colX(i) - widths[i] / 2, y + headH / 2 + 1); });
    y += headH;

    g.font = "400 15px " + FONT;
    list.forEach(function (r, n) {
      if (n % 2 === 1) { g.fillStyle = ZEB; g.fillRect(padX, y, W - padX * 2, rowH); }
      g.fillStyle = INK;
      COLS.forEach(function (c, i) { g.fillText(texts(c, r, n), colX(i) - widths[i] / 2, y + rowH / 2 + 1); });
      g.fillStyle = LINE; g.fillRect(padX, y + rowH - 1, W - padX * 2, 1);
      y += rowH;
    });

    var total = list.reduce(function (s, r) { return s + (num(r["المقدار"]) || 0); }, 0);
    g.textAlign = "right"; g.fillStyle = INK; g.font = "600 16px " + FONT;
    g.fillText("مجموع المقدار: " + fmtMoney(String(total)) + " دينار", W - padX, y + footH / 2);
    g.textAlign = "left"; g.direction = "ltr"; g.fillStyle = MUTED; g.font = "400 13px " + FONT;
    g.fillText(new Date().toLocaleString("en-GB"), padX, y + footH / 2);
    return cv;
  }

  function stamp() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  }

  function saveImage() {
    var list = currentView();
    if (!list.length) { toast("لا توجد صفوف لحفظها."); return; }
    var fonts = document.fonts && document.fonts.load
      ? Promise.all([document.fonts.load('400 15px "IBM Plex Sans Arabic"'), document.fonts.load('600 15px "IBM Plex Sans Arabic"')]).catch(function () {})
      : Promise.resolve();
    fonts.then(function () {
      var cv = buildCanvas(list);
      cv.toBlob(function (blob) {
        if (!blob) { toast("تعذّر إنشاء الصورة."); return; }
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
          nativeSave(blob);
        } else if (dlNS) {
          dlNS.save({ filename: "wallet-statement-" + stamp() + ".png", data: blob }).then(function () {
            toast("تم حفظ الصورة.");
          }, function (e) {
            if (e && e.code === "declined") return;
            showOverlay(blob);
          });
        } else { showOverlay(blob); }
      }, "image/png");
    });
  }

  function nativeSave(blob) {
    var fr = new FileReader();
    fr.onload = function () {
      var b64 = String(fr.result).split(",")[1];
      var P = window.Capacitor.Plugins;
      var name = "wallet-statement-" + stamp() + ".png";
      P.Filesystem.writeFile({ path: name, data: b64, directory: "CACHE" }).then(function (r) {
        return P.Share.share({ title: "كشف المحفظة", url: r.uri, dialogTitle: "حفظ أو مشاركة الصورة" });
      }).then(function () {}, function (e) {
        if (!(e && /cancel/i.test(String(e.message || e)))) showOverlay(blob);
      });
    };
    fr.readAsDataURL(blob);
  }

  var ovUrl = null;
  function showOverlay(blob) {
    if (ovUrl) URL.revokeObjectURL(ovUrl);
    ovUrl = URL.createObjectURL(blob);
    $("ovImg").src = ovUrl;
    $("overlay").hidden = false;
  }

  /* ---------- events ---------- */
  function readFile(f) {
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { loadText(String(fr.result), f.name); };
    fr.onerror = function () { toast("تعذّر قراءة الملف."); };
    fr.readAsText(f, "utf-8");
  }

  $("file").addEventListener("change", function (e) { readFile(e.target.files[0]); e.target.value = ""; });
  $("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  $("sortKey").addEventListener("change", function (e) { state.sortKey = e.target.value; render(); syncControls(); });
  $("dir").addEventListener("click", function () { state.dir = -state.dir; syncControls(); render(); });
  $("save").addEventListener("click", saveImage);
  $("ovClose").addEventListener("click", function () { $("overlay").hidden = true; });

  ["dragenter", "dragover"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); document.body.classList.add("dragging"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      e.preventDefault();
      if (ev === "drop" || e.target === document.documentElement) document.body.classList.remove("dragging");
      if (ev === "drop" && e.dataTransfer && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
    });
  });

  /* ---------- start ---------- */
  var sel = $("sortKey");
  COLS.forEach(function (c) {
    if (c.type === "serial") return;
    var o = el("option", "", "ترتيب: " + c.label);
    o.value = c.key; sel.appendChild(o);
  });
  syncControls();
  loadText(SAMPLE_CSV, SAMPLE_NAME + " (مثال)");

  try {
    if (window.claude && window.claude.use) {
      window.claude.use("downloads").then(function (d) { dlNS = d || null; }, function () { dlNS = null; });
    }
  } catch (e) { dlNS = null; }
})();
</script>

</body></html>
