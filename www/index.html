<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كشف المحفظة</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: centered title, three toolbar rows (actions / search / sort), one scrollable table with pinned header and serial column. */
:root {
  --bg: #f2f5f6;
  --surface: #ffffff;
  --fg: #14262b;
  --muted: #5b6e73;
  --line: #d5dddf;
  --zebra: #f1f5f6;
  --accent: #0f4c5c;
  --accent-fg: #ffffff;
  --font: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a1d; --surface: #162428; --fg: #e4eced; --muted: #93a8ad; --line: #2b3f44;
    --zebra: #1a2b30; --accent: #5fb4c7; --accent-fg: #07222a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a1d; --surface: #162428; --fg: #e4eced; --muted: #93a8ad; --line: #2b3f44;
  --zebra: #1a2b30; --accent: #5fb4c7; --accent-fg: #07222a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5;
  direction: rtl;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 1.5rem; font-weight: 600; text-align: center; text-wrap: balance; }
.row { display: flex; gap: 8px; align-items: stretch; }
.btn, select, input[type="search"] {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; min-height: 44px; padding: 0 14px;
}
.btn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; white-space: nowrap; }
.actions .btn { flex: 1 1 0; min-width: 0; padding: 0 6px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, select:focus-visible, input:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="search"] { flex: 1 1 auto; min-width: 0; }
.sortrow label { align-self: center; color: var(--muted); white-space: nowrap; }
.sortrow select { flex: 1 1 auto; min-width: 0; }
.sortrow .btn { flex: 0 0 auto; min-width: 84px; }
.stats { color: var(--muted); font-size: .92rem; }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 68vh; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 14px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
thead th { position: sticky; top: 0; z-index: 2; background: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 0; }
thead th button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 12px 14px; cursor: pointer; font-weight: 600; }
thead th.noSort { padding: 12px 14px; }
th[aria-sort="ascending"] button::after { content: " \25B2"; font-size: .7em; }
th[aria-sort="descending"] button::after { content: " \25BC"; font-size: .7em; }
tbody tr:nth-child(even) td { background: var(--zebra); }
tbody td { background: var(--surface); }
.pin { position: sticky; right: 0; z-index: 1; border-left: 1px solid var(--line); color: var(--muted); }
thead th.pin { z-index: 3; color: var(--accent-fg); }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); white-space: normal; }
.toast { position: fixed; inset-inline: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 420px; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 8px; text-align: center; z-index: 30; }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 18, 21, .82); display: flex; flex-direction: column; gap: 10px; align-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay p { color: #fff; margin: 0; text-align: center; }
.overlay .scroller { overflow: auto; flex: 1; min-height: 0; max-width: 100%; background: #fff; border-radius: 8px; }
.overlay img { display: block; max-width: none; width: 1000px; }
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head><body>


<div class="wrap" lang="ar">
  <h1>كشف المحفظة</h1>

  <div class="row actions">
    <label class="btn primary" for="file">فتح ملف</label>
    <input id="file" type="file" accept=".csv,.txt,text/csv" hidden>
    <button class="btn" id="saveImg" type="button">حفظ صورة</button>
    <button class="btn" id="savePdf" type="button">حفظ PDF</button>
  </div>

  <div class="row">
    <input id="q" type="search" placeholder="بحث" aria-label="بحث في الجدول">
  </div>

  <div class="row sortrow">
    <label for="sortKey">الترتيب حسب</label>
    <select id="sortKey"></select>
    <button class="btn" id="dir" type="button" aria-label="اتجاه الترتيب">تنازلي</button>
  </div>

  <div class="stats" id="stats" aria-live="polite"></div>

  <div class="tablebox">
    <table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="overlay" id="overlay" hidden>
  <p>اضغط مطولاً على الصورة لحفظها، أو مرّر لرؤية باقي الجدول.</p>
  <div class="scroller"><img id="ovImg" alt="صورة الكشف"></div>
  <button class="btn primary" id="ovClose" type="button">إغلاق</button>
</div>

<script src="native.js"></script>
<script>
(function () {
  "use strict";

  // type: serial | money | id | dt (timestamp text) | d (dd/mm/yyyy) | text
  // screen: shown in the on-screen table. Every column goes into the saved image and PDF.
  var COLS = [
    { key: "#", label: "التسلسل", type: "serial", screen: true },
    { key: "المقدار", label: "المقدار", type: "money", screen: false },
    { key: "الرصيد", label: "الرصيد", type: "money", screen: false },
    { key: "التاريخ", label: "التاريخ", type: "dt", screen: true },
    { key: "الاشتراك", label: "الاشتراك", type: "text", screen: true },
    { key: "بطاقة تعريف", label: "بطاقة تعريف", type: "id", screen: false },
    { key: "معرف المشترك", label: "معرف المشترك", type: "id", screen: true },
    { key: "المنطقة", label: "المنطقة", type: "text", screen: true },
    { key: "اسم الاشتراك", label: "اسم الاشتراك", type: "text", screen: false },
    { key: "تاريخ البدء", label: "تاريخ البدء", type: "d", screen: false },
    { key: "تاريخ الانتهاء", label: "تاريخ الانتهاء", type: "d", screen: false },
    { key: "نوع الدفع", label: "نوع الدفع", type: "text", screen: true },
    { key: "مقدار الخصم", label: "مقدار الخصم", type: "money", screen: false }
  ];
  var SCREEN = COLS.filter(function (c) { return c.screen; });

  var MONTHS = {
    "كانون الثاني": 1, "شباط": 2, "اذار": 3, "نيسان": 4, "ايار": 5, "حزيران": 6,
    "تموز": 7, "اب": 8, "ايلول": 9, "تشرين الاول": 10, "تشرين الثاني": 11, "كانون الاول": 12
  };
  var DT_RE = /(\d{1,2})\s+(.+?)\s+(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/;

  var state = { rows: [], sortKey: "التاريخ", dir: -1, q: "" };
  var dlNS = null;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- parsing ---------- */
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    var first = text.split(/\r?\n/, 1)[0] || "";
    var delim = [",", ";", "\t"].map(function (d) { return [d, first.split(d).length]; })
      .sort(function (a, b) { return b[1] - a[1]; })[0][0];
    var rows = [], row = [], cell = "", inQ = false, i, ch;
    for (i = 0; i < text.length; i++) {
      ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else { inQ = false; }
        } else { cell += ch; }
      } else if (ch === '"') { inQ = true; }
      else if (ch === delim) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else { cell += ch; }
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function loadText(text) {
    var all = parseCSV(text);
    if (all.length < 2) { toast("الملف فارغ أو لا يحتوي صفوفاً."); return false; }
    var idx = {};
    all[0].forEach(function (h, i) {
      h = h.trim();
      if (h && !(h in idx)) idx[h] = i;
    });
    var found = COLS.filter(function (c) { return c.key !== "#" && idx[c.key] !== undefined; }).length;
    if (found < 3) { toast("لم أجد أعمدة الكشف في هذا الملف. تأكد أنه ملف معاملات المحفظة."); return false; }
    var rows = [];
    all.slice(1).forEach(function (r) {
      // Some rows come shifted to the right by empty cells; move them back.
      var k = 0;
      while (k < r.length && r[k].trim() === "") k++;
      if (k === r.length) return;
      if (k >= 2) r = r.slice(k);
      var o = {}, any = false;
      COLS.forEach(function (c) {
        if (c.key === "#") return;
        var v = idx[c.key] !== undefined && r[idx[c.key]] !== undefined ? r[idx[c.key]].trim() : "";
        o[c.key] = v;
        if (v) any = true;
      });
      if (any) rows.push(o);
    });
    if (!rows.length) { toast("لم أجد صفوف بيانات في الملف."); return false; }
    state.rows = rows;
    render();
    return true;
  }

  /* ---------- values ---------- */
  function num(s) {
    var n = parseFloat(String(s).replace(/,/g, ""));
    return isNaN(n) ? null : n;
  }
  function fmtMoney(s) {
    var n = num(s);
    if (n === null) return s || "—";
    return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function norm(s) { return s.replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/\s+/g, " ").trim(); }
  function pad2(n) { n = String(n); return n.length < 2 ? "0" + n : n; }
  function parseDT(s) {
    var m = DT_RE.exec(s);
    if (m) {
      var mon = MONTHS[norm(m[2])];
      if (mon) return Date.UTC(+m[3], mon - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    }
    var t = Date.parse(s);
    return isNaN(t) ? null : t;
  }
  function parseD(s) {
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s.trim());
    return m ? Date.UTC(+m[3], +m[2] - 1, +m[1]) : parseDT(s);
  }
  // "20 تشرين الأول 2026 23:34:50" -> "20/10/2026 11:34:50 م"
  function fmtDT(s) {
    var m = DT_RE.exec(s);
    var mon = m && MONTHS[norm(m[2])];
    if (!mon) return s;
    var out = pad2(m[1]) + "/" + pad2(mon) + "/" + m[3];
    if (m[4] !== undefined) {
      var h = +m[4], ap = h >= 12 ? "م" : "ص";
      h = h % 12 || 12;
      out += " " + h + ":" + m[5] + (m[6] !== undefined ? ":" + m[6] : "") + " " + ap;
    }
    return out;
  }
  function cellText(c, v) {
    if (v === "" || v === undefined) return "—";
    if (c.type === "money") return fmtMoney(v);
    if (c.type === "dt") return fmtDT(v);
    return v;
  }
  function sortVal(c, v) {
    if (c.type === "money" || c.type === "id") return num(v);
    if (c.type === "dt") return parseDT(v);
    if (c.type === "d") return parseD(v);
    return v;
  }

  function currentView() {
    var q = state.q.trim().toLowerCase();
    var list = state.rows.map(function (r, i) { return { r: r, i: i }; });
    if (q) {
      list = list.filter(function (x) {
        return COLS.some(function (c) {
          return c.key !== "#" && cellText(c, x.r[c.key]).toLowerCase().indexOf(q) !== -1;
        });
      });
    }
    var col = COLS.filter(function (c) { return c.key === state.sortKey; })[0];
    if (col && col.type !== "serial") {
      list.sort(function (a, b) {
        var va = sortVal(col, a.r[col.key]), vb = sortVal(col, b.r[col.key]);
        var c;
        if (va === null && vb === null) c = 0;
        else if (va === null) c = 1;
        else if (vb === null) c = -1;
        else if (typeof va === "string") c = va.localeCompare(vb, "ar");
        else c = va - vb;
        return c !== 0 ? c * state.dir : a.i - b.i;
      });
    }
    return list.map(function (x) { return x.r; });
  }

  /* ---------- render ---------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildHead() {
    var thead = $("thead");
    thead.textContent = "";
    var tr = el("tr");
    SCREEN.forEach(function (c) {
      var th = el("th");
      th.scope = "col";
      if (c.type === "serial") {
        th.className = "pin noSort";
        th.textContent = c.label;
      } else {
        var b = el("button", "", c.label);
        b.type = "button";
        b.addEventListener("click", function () {
          if (state.sortKey === c.key) state.dir = -state.dir; else { state.sortKey = c.key; state.dir = 1; }
          syncControls(); render();
        });
        th.appendChild(b);
        th.setAttribute("aria-sort", state.sortKey === c.key ? (state.dir === 1 ? "ascending" : "descending") : "none");
      }
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  function render() {
    var has = state.rows.length > 0;
    var list = has ? currentView() : [];
    buildHead();
    var tbody = $("tbody");
    tbody.textContent = "";
    if (!list.length) {
      var tr0 = el("tr"), td0 = el("td", "empty", has ? "لا توجد صفوف مطابقة." : "لا توجد بيانات. اضغط «فتح ملف» واختر ملف المعاملات (CSV).");
      td0.colSpan = SCREEN.length;
      tr0.appendChild(td0); tbody.appendChild(tr0);
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (r, n) {
      var tr = el("tr");
      SCREEN.forEach(function (c) {
        tr.appendChild(el("td", c.type === "serial" ? "pin" : "", c.type === "serial" ? String(n + 1) : cellText(c, r[c.key])));
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    var st = $("stats");
    st.textContent = "";
    if (has) {
      st.appendChild(document.createTextNode("عدد المعاملات: "));
      st.appendChild(el("b", "", list.length + (list.length !== state.rows.length ? " من " + state.rows.length : "")));
    }
    $("saveImg").disabled = !has;
    $("savePdf").disabled = !has;
  }

  function syncControls() {
    $("dir").textContent = state.dir === 1 ? "تصاعدي" : "تنازلي";
    $("sortKey").value = state.sortKey;
  }

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }

  /* ---------- drawing the saved image / PDF pages (all columns) ---------- */
  var FONT = '"IBM Plex Sans Arabic", Tahoma, sans-serif';
  var DIM = { padX: 24, titleH: 70, headH: 46, rowH: 40, footH: 50, cellPad: 30 };

  function measure(list) {
    var mctx = document.createElement("canvas").getContext("2d");
    return COLS.map(function (c) {
      mctx.font = "600 15px " + FONT;
      var w = mctx.measureText(c.label).width;
      mctx.font = "400 15px " + FONT;
      list.forEach(function (r, n) {
        var t = c.type === "serial" ? String(n + 1) : cellText(c, r[c.key]);
        w = Math.max(w, mctx.measureText(t).width);
      });
      return Math.ceil(w + DIM.cellPad);
    });
  }

  // o: { offset, footer, total, count, sortText, pageText }
  function buildCanvas(rows, widths, o) {
    var D = DIM;
    var tableW = widths.reduce(function (a, b) { return a + b; }, 0);
    var W = Math.max(tableW + D.padX * 2, 720);
    var H = D.titleH + D.headH + D.rowH * rows.length + (o.footer ? D.footH : 0) + D.padX;
    var S = Math.min(2, 16000 / H);
    var cv = document.createElement("canvas");
    cv.width = Math.round(W * S); cv.height = Math.round(H * S);
    cv._w = W; cv._h = H;
    var g = cv.getContext("2d");
    g.scale(S, S);
    g.direction = "rtl"; g.textBaseline = "middle";
    var INK = "#14262b", MUTED = "#5b6e73", HEAD = "#0f4c5c", ZEB = "#f1f5f6", LINE = "#d5dddf";
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);

    g.textAlign = "right"; g.fillStyle = INK; g.font = "600 24px " + FONT;
    g.fillText("كشف المحفظة", W - D.padX, 28);
    g.fillStyle = MUTED; g.font = "400 14px " + FONT;
    g.fillText("عدد المعاملات: " + o.count + "   |   الترتيب: " + o.sortText, W - D.padX, 54);
    if (o.pageText) { g.textAlign = "left"; g.direction = "ltr"; g.fillText(o.pageText, D.padX, 28); g.direction = "rtl"; g.textAlign = "right"; }

    var x0 = W - D.padX, y = D.titleH;
    function colX(i) { var x = x0; for (var k = 0; k < i; k++) x -= widths[k]; return x; }
    g.fillStyle = HEAD; g.fillRect(D.padX, y, W - D.padX * 2, D.headH);
    g.textAlign = "center"; g.fillStyle = "#ffffff"; g.font = "600 15px " + FONT;
    COLS.forEach(function (c, i) { g.fillText(c.label, colX(i) - widths[i] / 2, y + D.headH / 2 + 1); });
    y += D.headH;

    g.font = "400 15px " + FONT;
    rows.forEach(function (r, n) {
      if (n % 2 === 1) { g.fillStyle = ZEB; g.fillRect(D.padX, y, W - D.padX * 2, D.rowH); }
      g.fillStyle = INK;
      COLS.forEach(function (c, i) {
        var t = c.type === "serial" ? String(o.offset + n + 1) : cellText(c, r[c.key]);
        g.fillText(t, colX(i) - widths[i] / 2, y + D.rowH / 2 + 1);
      });
      g.fillStyle = LINE; g.fillRect(D.padX, y + D.rowH - 1, W - D.padX * 2, 1);
      y += D.rowH;
    });

    if (o.footer) {
      g.textAlign = "right"; g.fillStyle = INK; g.font = "600 16px " + FONT;
      g.fillText("مجموع المقدار: " + fmtMoney(String(o.total)) + " دينار", W - D.padX, y + D.footH / 2);
      g.textAlign = "left"; g.direction = "ltr"; g.fillStyle = MUTED; g.font = "400 13px " + FONT;
      g.fillText(new Date().toLocaleString("en-GB"), D.padX, y + D.footH / 2);
    }
    return cv;
  }

  function exportInfo(list) {
    var col = COLS.filter(function (c) { return c.key === state.sortKey; })[0];
    return {
      count: list.length,
      total: list.reduce(function (s, r) { return s + (num(r["المقدار"]) || 0); }, 0),
      sortText: (col ? col.label : "") + (state.dir === 1 ? " تصاعدي" : " تنازلي")
    };
  }

  function loadFonts() {
    return document.fonts && document.fonts.load
      ? Promise.all([document.fonts.load('400 15px "IBM Plex Sans Arabic"'), document.fonts.load('600 15px "IBM Plex Sans Arabic"')]).catch(function () {})
      : Promise.resolve();
  }

  /* ---------- minimal PDF writer (one JPEG per page) ---------- */
  function dataUrlToBytes(u) {
    var bin = atob(u.split(",")[1]), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function makePdf(pages) {
    var enc = new TextEncoder(), parts = [], offsets = [], len = 0;
    function push(x) { var b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); len += b.length; }
    function obj(n, body) { offsets[n] = len; push(n + " 0 obj\n" + body + "\nendobj\n"); }
    push("%PDF-1.4\n");
    obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
    obj(2, "<< /Type /Pages /Kids [" + pages.map(function (_, i) { return (3 + i * 3) + " 0 R"; }).join(" ") + "] /Count " + pages.length + " >>");
    pages.forEach(function (p, i) {
      var n = 3 + i * 3;
      obj(n, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + p.pw + " " + p.ph + "] /Resources << /XObject << /Im0 " + (n + 2) + " 0 R >> >> /Contents " + (n + 1) + " 0 R >>");
      var content = "q " + p.pw + " 0 0 " + p.ph + " 0 0 cm /Im0 Do Q";
      obj(n + 1, "<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream");
      offsets[n + 2] = len;
      push((n + 2) + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + p.w + " /Height " + p.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + p.jpeg.length + " >>\nstream\n");
      push(p.jpeg);
      push("\nendstream\nendobj\n");
    });
    var count = 3 + pages.length * 3, xref = len, x = "xref\n0 " + count + "\n0000000000 65535 f \n";
    for (var k = 1; k < count; k++) x += String(offsets[k]).padStart(10, "0") + " 00000 n \n";
    push(x + "trailer\n<< /Size " + count + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF");
    return new Blob(parts, { type: "application/pdf" });
  }

  /* ---------- saving ---------- */
  function stamp() {
    var d = new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "-" + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function isNative() {
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  }
  function blobToBase64(blob) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(",")[1]); };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsDataURL(blob);
    });
  }
  function deliver(blob, filename, previewCv) {
    if (isNative()) {
      if (!window.NativeSave) { toast("أدوات الحفظ غير محمّلة. أعد تثبيت التطبيق."); return; }
      blobToBase64(blob).then(function (b64) { return window.NativeSave(b64, filename); }).then(function () {}, function (e) {
        var m = String((e && e.message) || e || "");
        if (/cancel/i.test(m)) return;
        toast("تعذّر الحفظ: " + m.slice(0, 80));
      });
      return;
    }
    if (dlNS) {
      dlNS.save({ filename: filename, data: blob }).then(function () { toast("تم الحفظ."); }, function (e) {
        if (e && e.code === "declined") return;
        if (previewCv) showOverlay(previewCv); else toast("تعذّر الحفظ هنا.");
      });
      return;
    }
    if (previewCv) showOverlay(previewCv); else toast("الحفظ غير متاح في هذا المتصفح.");
  }

  function saveImage() {
    var list = currentView();
    if (!list.length) { toast("لا توجد صفوف لحفظها."); return; }
    if (list.length > 300) toast("عدد الصفوف كبير، يفضّل حفظ PDF لوضوح أفضل.");
    loadFonts().then(function () {
      var cv;
      try { cv = buildCanvas(list, measure(list), Object.assign({ offset: 0, footer: true }, exportInfo(list))); }
      catch (e) { toast("تعذّر إنشاء الصورة."); return; }
      cv.toBlob(function (blob) {
        if (!blob) { toast("تعذّر إنشاء الصورة."); return; }
        deliver(blob, "wallet-statement-" + stamp() + ".png", cv);
      }, "image/png");
    });
  }

  function savePdf() {
    var list = currentView();
    if (!list.length) { toast("لا توجد صفوف لحفظها."); return; }
    loadFonts().then(function () {
      var widths = measure(list), info = exportInfo(list), PER = 30, n = Math.ceil(list.length / PER), pages = [];
      try {
        for (var i = 0; i < n; i++) {
          var cv = buildCanvas(list.slice(i * PER, (i + 1) * PER), widths,
            Object.assign({ offset: i * PER, footer: i === n - 1, pageText: n > 1 ? "صفحة " + (i + 1) + " من " + n : "" }, info));
          pages.push({
            jpeg: dataUrlToBytes(cv.toDataURL("image/jpeg", 0.92)),
            w: cv.width, h: cv.height,
            pw: Math.round(cv._w * 0.75), ph: Math.round(cv._h * 0.75)
          });
        }
        deliver(makePdf(pages), "wallet-statement-" + stamp() + ".pdf", null);
      } catch (e) { toast("تعذّر إنشاء ملف PDF."); }
    });
  }

  function showOverlay(cv) {
    try { $("ovImg").src = cv.toDataURL("image/png"); } catch (e) { toast("تعذّر عرض الصورة."); return; }
    $("overlay").hidden = false;
  }

  /* ---------- events ---------- */
  function readFile(f) {
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { loadText(String(fr.result)); };
    fr.onerror = function () { toast("تعذّر قراءة الملف."); };
    fr.readAsText(f, "utf-8");
  }

  $("file").addEventListener("change", function (e) { readFile(e.target.files[0]); e.target.value = ""; });
  $("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  $("sortKey").addEventListener("change", function (e) { state.sortKey = e.target.value; syncControls(); render(); });
  $("dir").addEventListener("click", function () { state.dir = -state.dir; syncControls(); render(); });
  $("saveImg").addEventListener("click", saveImage);
  $("savePdf").addEventListener("click", savePdf);
  $("ovClose").addEventListener("click", function () { $("overlay").hidden = true; });

  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });

  /* ---------- start (no data until a file is opened) ---------- */
  var sel = $("sortKey");
  COLS.forEach(function (c) {
    if (c.type === "serial") return;
    var o = el("option", "", c.label);
    o.value = c.key; sel.appendChild(o);
  });
  syncControls();
  render();

  try {
    if (window.claude && window.claude.use) {
      window.claude.use("downloads").then(function (d) { dlNS = d || null; }, function () { dlNS = null; });
    }
  } catch (e) { dlNS = null; }
})();
</script>

</body></html>
